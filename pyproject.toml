[project]
name = "gesturectl"
version = "0.1.0"
description = "Real-time hand-gesture control of motors: MediaPipe landmarks, a small classifier, and a failsafe UDP link to an Arduino."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.20",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
gesturectl = "gesturectl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesturectl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer.Option in defaults is the idiomatic Typer pattern
# DTZ005: local timestamps are only used for file names
ignore = ["B008", "DTZ005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
